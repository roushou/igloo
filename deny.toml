# cargo-deny configuration. Everything not set here uses cargo-deny's defaults:
# vulnerability advisories are errors, unmaintained/yanked crates are reported.

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # The Mozilla CA bundle shipped by webpki-root-certs, which TLS verification depends on.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# The list covers common permissive licenses ahead of need; don't warn while some are unused.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
