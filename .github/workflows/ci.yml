name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install dprint
        uses: taiki-e/install-action@v2
        with:
          tool: dprint

      - name: Rust formatting
        run: cargo fmt --check

      - name: TOML, Markdown and JSON formatting
        run: dprint check

  protobuf:
    name: Protobuf lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Protobuf lint
        uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: false
          push: false

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Tests
        run: cargo nextest run --workspace --profile ci --no-tests=warn

      - name: Doc tests
        run: cargo test --doc --workspace

  sqlx:
    name: SQL schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: igloo
          POSTGRES_PASSWORD: igloo
          POSTGRES_DB: igloo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U igloo"
          --health-interval 1s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: SQL queries match the schema
        env:
          DATABASE_URL: postgres://igloo:igloo@localhost:5432/igloo
          SQLX_OFFLINE: "false"
        run: |
          sqlx migrate run --source crates/igloo-control/migrations
          cargo sqlx prepare --workspace --check

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependency tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-shear

      - name: Dependency audit (advisories, licenses, sources)
        run: cargo deny check

      - name: Unused dependencies
        run: cargo shear

  isolation:
    name: Linux isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: igloo
          POSTGRES_PASSWORD: igloo
          POSTGRES_DB: igloo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U igloo"
          --health-interval 1s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install youki and busybox
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static
          curl -fsSL https://github.com/youki-dev/youki/releases/download/v0.7.0/youki-0.7.0-x86_64-musl.tar.gz \
            | sudo tar -xz -C /usr/local/bin youki

      - name: Isolation tests as root (overlay file systems, OCI runtime, phase 2 exit gate)
        env:
          IGLOO_TEST_OVERLAY: "1"
          IGLOO_TEST_OCI: "1"
          IGLOO_TEST_OCI_RUNTIME: /usr/local/bin/youki
          IGLOO_TEST_BUSYBOX: /bin/busybox
          IGLOO_TEST_EXIT_GATE: "1"
          IGLOO_TEST_DATABASE_URL: postgres://igloo:igloo@localhost:5432/igloo
        run: |
          sudo -E env "PATH=$PATH" CARGO_TARGET_DIR=/tmp/root-target cargo test -p igloo-worker
          sudo -E env "PATH=$PATH" CARGO_TARGET_DIR=/tmp/root-target cargo test -p igloo-control --test exit_gate

  ci:
    runs-on: ubuntu-latest
    needs: [formatting, protobuf, clippy, tests, sqlx, dependencies, isolation]
    if: always()
    steps:
      - name: All checks passed
        env:
          ALL_CHECKS_PASSED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: test "$ALL_CHECKS_PASSED" = "true"
