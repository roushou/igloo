[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/roushou/igloo"
rust-version = "1.99.0"

# Only dependencies used by two or more crates live here. A dependency used by a single crate
# is declared in that crate's manifest, and moves here when a second crate needs it.
[workspace.dependencies]
igloo-api = { path = "crates/igloo-api", version = "0.1.0" }
igloo-core = { path = "crates/igloo-core", version = "0.1.0" }
igloo-git = { path = "crates/igloo-git" }
igloo-rs = { path = "crates/igloo-rs", version = "0.1.0" }
igloo-worker-protocol = { path = "crates/igloo-worker-protocol" }

async-trait = "0.1.92"
blake3 = "1.8.7"
eyre = "0.6.14"
# Default features read the system time zone database; Igloo needs UTC instants only.
jiff = { version = "0.2.37", default-features = false, features = ["serde", "std"] }
prost = "0.14.4"
# Plain HTTP to local servers for now; TLS arrives with remote deployments.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
tonic = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"
uuid = { version = "1.27.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
self_named_module_files = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
