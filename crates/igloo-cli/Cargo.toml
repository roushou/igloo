[package]
name = "igloo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "igloo"
path = "src/main.rs"
# The binary shares the name `igloo` with the igloo-rs library; documenting both would
# collide on the output path `target/doc/igloo`.
doc = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
igloo-core.workspace = true
igloo-git.workspace = true
igloo-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
igloo-git = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
